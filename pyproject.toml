[project]
name = "gfx-capture"
version = "0.1.0"
description = "Small tethered-capture GUI for Fujifilm GFX/X cameras via the Fujifilm Camera Control SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pillow>=10", "numpy>=1.24", "rawpy>=0.19", "tifffile>=2023.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
gfx-capture = "gfx_capture.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gfx_capture"]
